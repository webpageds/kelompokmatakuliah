<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Curriculum Center</title><style>body{margin:0;background:#f3f6fa;color:#172b3e;font:14px/1.5 system-ui}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#10243a;color:white;padding:22px}.side button{display:block;width:100%;padding:12px;text-align:left;border:0;background:transparent;color:#dce5ed;cursor:pointer;border-radius:8px}.side button.active,.side button:hover{background:#ffffff20}.main{min-width:0}.top{background:white;padding:18px 28px;border-bottom:1px solid #e4eaf0}.content{padding:28px;max-width:1250px;margin:auto}.eyebrow{color:#0e8a83;font-size:10px;letter-spacing:2px;font-weight:bold}.hero{display:flex;justify-content:space-between}.hero h1{font-size:27px;margin:5px 0}.muted{color:#6e7e8d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat,.panel{background:white;border:1px solid #e4eaf0;border-radius:12px;padding:17px}.stat strong{display:block;font-size:25px;margin:8px 0}.tag{background:#eaf5f3;color:#08746e;padding:5px 10px;border-radius:20px;font-size:10px;font-weight:bold}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.row{display:grid;grid-template-columns:100px 1fr 24px;gap:10px;margin:14px 0;align-items:center}.bar{height:8px;background:#edf1f5;border-radius:8px}.bar span{display:block;background:#0e8a83;height:8px;border-radius:8px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{padding:13px;text-align:left;background:#f7f9fb;border:1px solid #e4eaf0;border-radius:9px;cursor:pointer}.quick b{display:block;margin-top:5px}.toolbar{display:flex;gap:8px;margin:15px 0}.field,.btn{padding:9px 11px;border:1px solid #e4eaf0;border-radius:8px;background:white}.search{flex:1;min-width:160px}.btn{cursor:pointer;font-weight:bold;font-size:12px}.primary{background:#0e8a83;color:white}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf1f5;font-size:12px}.table th{font-size:10px;color:#708293;background:#f8fafb}.table td b{display:block}.sub{font-size:10px;color:#6e7e8d}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card p{color:#6e7e8d;font-size:12px}.progress{height:7px;background:#eef1f5;border-radius:8px;margin:10px 0}.progress span{display:block;height:7px;background:#0e8a83;border-radius:8px}.modalbg{display:none;position:fixed;inset:0;background:#001526bb;align-items:center;justify-content:center;padding:15px}.modalbg.show{display:flex}.modal{background:white;border-radius:12px;width:min(600px,100%);padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:11px;font-weight:bold}.form input,.form select,.form textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #e4eaf0;border-radius:8px}.full{grid-column:1/-1}.toast{display:none;position:fixed;bottom:20px;right:20px;padding:12px;background:#10243a;color:white;border-radius:8px}.toast.show{display:block}@media(max-width:800px){.layout{display:block}.side{padding:12px}.content{padding:18px}.stats{grid-template-columns:1fr 1fr}.grid,.cards{grid-template-columns:1fr}.hero{display:block}.form{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{flex-wrap:wrap}}</style></head><body><div class="layout"><aside class="side"><b>AC · ACADEMIC CURRICULUM</b><p class="muted" style="color:#b5c4d0">Center · Accounting Program</p><p class="eyebrow" style="color:#93aabc">WORKSPACE</p><button data-page="dashboard" class="active">⌂ Dashboard</button><p class="eyebrow" style="color:#93aabc">MANAJEMEN KURIKULUM</p><button data-page="kbk">▦ Kelompok Bidang Keahlian</button><button data-page="courses">▤ Kelompok Mata Kuliah</button><button data-page="rps">▧ RPS Development</button><p style="margin-top:38px;color:#aabac8;font-size:11px">Program Studi Akuntansi<br>Universitas Pamulang · Serang</p></aside><main class="main"><div class="top" id="crumb">Workspace / Dashboard</div><section class="content" id="content"></section></main></div><div id="modalbg" class="modalbg"><div class="modal"><h3 id="mtitle"></h3><div id="mbody"></div><div id="mfoot" style="margin-top:15px;text-align:right"></div></div></div><div id="toast" class="toast"></div>
<script>
const seed=[{"id":"accounting-for-small-medium-enterprise","name":"ACCOUNTING FOR SMALL MEDIUM ENTERPRISE","semester":"6","curriculum":"OBE","leader":"RIRIN SARI DEWI","kbk":"KEUANGAN","lecturers":["RIRIN SARI DEWI","LISTIA AULIA INDY","YAYAH SYAHRIYAH"]},{"id":"ai-automation-in-accounting","name":"AI & AUTOMATION IN ACCOUNTING","semester":"7","curriculum":"OBE","leader":"AHMAD SYUHERI","kbk":"MANAJEMEN","lecturers":["AHMAD SYUHERI","MUCHAMAD RIZKY FAUZI"]}];let courses=JSON.parse(localStorage.getItem('acc_courses')||'null')||seed,rps=JSON.parse(localStorage.getItem('acc_rps')||'{}'),page='dashboard',flt={q:'',kbk:'',sem:'',status:''};const KBK=['KEUANGAN','MANAJEMEN','PAJAK','AUDIT'];const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('acc_courses',JSON.stringify(courses));localStorage.setItem('acc_rps',JSON.stringify(rps))}function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));function go(x){page=x;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===x));render()}function hero(k,t,d,a=''){return '<div class="hero"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="muted">'+d+'</p></div>'+a+'</div>'}function stat(k,v,d){return '<div class="stat"><small>'+k+'</small><strong>'+v+'</strong><small class="muted">'+d+'</small></div>'}function render(){let label={dashboard:'Dashboard',kbk:'Kelompok Bidang Keahlian',courses:'Kelompok Mata Kuliah',rps:'RPS Development'};$('crumb').textContent='Workspace / '+label[page];$('content').innerHTML=({dashboard,kbk:kbkPage,courses:coursePage,rps:rpsPage}[page])()}function dashboard(){let counts=KBK.map(k=>[k,courses.filter(c=>c.kbk===k).length]),all=courses.filter(c=>c.kbk==='ALL').length;return hero('ACADEMIC CURRICULUM CENTER','Dashboard','Pusat pengelolaan bidang keahlian, kelompok mata kuliah, ketua KMK, dan RPS.')+'<div class="stats">'+stat('TOTAL MATA KULIAH',courses.length,'Data mapping KMK')+stat('KELOMPOK BIDANG KEAHLIAN',4,'Keuangan · Manajemen · Pajak · Audit')+stat('MATA KULIAH LINTAS BIDANG',all,'Kode KBK ALL')+stat('RPS SELESAI',Object.values(rps).filter(x=>x.status==='Selesai').length,'Dokumen selesai')+'</div><div class="grid"><div class="panel"><b>Distribusi Mata Kuliah per KBK</b>'+counts.map(([k,n])=>'<div class="row"><span>'+k+'</span><div class="bar"><span style="width:'+n/Math.max(...counts.map(a=>a[1]))*100+'%"></span></div>'+n+'</div>').join('')+'</div><div class="panel"><b>Akses Cepat</b><div class="quick"><button onclick="go(\'kbk\')">▦<b>Bidang Keahlian</b><small>Empat KBK</small></button><button onclick="go(\'courses\')">▤<b>Kelompok MK</b><small>Daftar dan ketua KMK</small></button><button onclick="go(\'rps\')">▧<b>RPS Development</b><small>Monitoring RPS</small></button><button onclick="backup()">⇩<b>Backup Data</b><small>Ekspor JSON</small></button></div></div></div>'}function kbkPage(){let desc=['Akuntansi keuangan, pelaporan, dan investasi.','Akuntansi manajemen, tata kelola, dan keputusan.','Perpajakan dan perencanaan pajak.','Pemeriksaan, audit, assurance, dan forensik.'];return hero('STRUKTUR AKADEMIK','Kelompok Bidang Keahlian','Empat bidang utama pengelolaan kurikulum.')+'<div class="cards">'+KBK.map((k,i)=>'<div class="panel card"><span class="tag">0'+(i+1)+' · KBK</span><h3>'+k+'</h3><p>'+desc[i]+'</p><span class="tag">'+courses.filter(c=>c.kbk===k).length+' Mata Kuliah</span><p><button class="btn" onclick="filterKBK(\''+k+'\')">Lihat Mata Kuliah →</button></p></div>').join('')+'</div><div class="panel" style="margin-top:14px"><b>Mata Kuliah Lintas Bidang (ALL)</b><p>'+courses.filter(c=>c.kbk==='ALL').map(c=>'<span class="tag">'+esc(c.name)+'</span>').join(' ')+'</p></div>'}function filtered(){return courses.filter(c=>(!flt.q||(c.name+' '+c.leader).toLowerCase().includes(flt.q.toLowerCase()))&&(!flt.kbk||c.kbk===flt.kbk)&&(!flt.sem||c.semester.split(/[&,]/).map(x=>x.trim()).includes(flt.sem)))}function coursePage(){return hero('DATABASE KURIKULUM','Kelompok Mata Kuliah','Mata kuliah, semester, kurikulum, KBK, ketua KMK, dan dosen pengampu.','<button class="btn primary" onclick="editCourse()">＋ Tambah Mata Kuliah</button>')+'<div class="toolbar"><input class="field search" placeholder="Cari mata kuliah / ketua KMK" oninput="flt.q=this.value;refreshCourses()"><select class="field" id="kf" onchange="flt.kbk=this.value;refreshCourses()"><option value="">Semua KBK</option>'+KBK.map(k=>'<option>'+k+'</option>').join('')+'<option value="ALL">Lintas Bidang</option></select><select class="field" onchange="flt.sem=this.value;refreshCourses()"><option value="">Semua Semester</option>'+[1,2,3,4,5,6,7,8].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="panel"><div class="tablewrap" id="ct">'+courseRows(filtered())+'</div></div>'}function courseRows(list){return '<table class="table"><thead><tr><th>Mata Kuliah</th><th>Semester</th><th>Kurikulum</th><th>KBK</th><th>Ketua KMK</th><th>Dosen</th><th></th></tr></thead><tbody>'+list.map(c=>'<tr><td><b>'+esc(c.name)+'</b><span class="sub">'+esc(c.id)+'</span></td><td>'+esc(c.semester)+'</td><td>'+esc(c.curriculum)+'</td><td><span class="tag">'+esc(c.kbk==='ALL'?'Lintas Bidang':c.kbk)+'</span></td><td>'+esc(c.leader)+'</td><td>'+(c.lecturers||[]).length+' dosen<span class="sub">'+esc((c.lecturers||[]).slice(0,2).join(', '))+'</span></td><td><button class="btn" onclick="editCourse(\''+c.id+'\')">Edit</button></td></tr>').join('')+'</tbody></table>'}function refreshCourses(){$('ct').innerHTML=courseRows(filtered())}function filterKBK(k){go('courses');flt.kbk=k;setTimeout(()=>{$('kf').value=k;refreshCourses()},10)}function modal(t,b,foot){$('mtitle').textContent=t;$('mbody').innerHTML=b;$('mfoot').innerHTML=foot;$('modalbg').classList.add('show')}function closeModal(){$('modalbg').classList.remove('show')}function editCourse(id=''){let c=courses.find(x=>x.id===id)||{name:'',semester:'',curriculum:'OBE',kbk:'KEUANGAN',leader:'',lecturers:[]};modal(id?'Edit Mata Kuliah':'Tambah Mata Kuliah','<form id="cf" class="form"><div class="fg full"><label>Nama Mata Kuliah</label><input required name="name" value="'+esc(c.name)+'"></div><div class="fg"><label>KBK</label><select name="kbk">'+[...KBK,'ALL'].map(k=>'<option '+(k===c.kbk?'selected':'')+'>'+k+'</option>').join('')+'</select></div><div class="fg"><label>Semester</label><input name="semester" value="'+esc(c.semester)+'"></div><div class="fg"><label>Kurikulum</label><input name="curriculum" value="'+esc(c.curriculum)+'"></div><div class="fg"><label>Ketua KMK</label><input required name="leader" value="'+esc(c.leader)+'"></div><div class="fg full"><label>Dosen Pengampu (pisahkan koma)</label><textarea name="lecturers">'+esc((c.lecturers||[]).join(', '))+'</textarea></div></form>',(id?'<button class="btn" onclick="deleteCourse(\''+id+'\')">Hapus</button>':'')+'<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveCourse(\''+id+'\')">Simpan</button>')}function saveCourse(id){let form=$('cf');if(!form.reportValidity())return;let d=new FormData(form),name=d.get('name').trim(),slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),v={id:slug,name,semester:d.get('semester'),curriculum:d.get('curriculum'),kbk:d.get('kbk'),leader:d.get('leader'),lecturers:d.get('lecturers').split(',').map(x=>x.trim()).filter(Boolean)};if(id)courses=courses.map(c=>c.id===id?v:c);else{if(courses.some(c=>c.id===slug)){toast('Mata kuliah sudah ada');return}courses.push(v)}save();closeModal();render()}function deleteCourse(id){if(!confirm('Hapus mata kuliah?'))return;courses=courses.filter(c=>c.id!==id);save();closeModal();render()}function rpsPage(){let list=filtered();return hero('PENGEMBANGAN PEMBELAJARAN','RPS Development','Pantau proses penyusunan Rencana Pembelajaran Semester.')+'<div class="stats">'+stat('TOTAL MK',courses.length,'Target RPS')+stat('BELUM DIMULAI',courses.filter(c=>!rps[c.id]||rps[c.id].status==='Belum Dimulai').length,'Menunggu')+stat('DALAM PROSES',Object.values(rps).filter(x=>x.status==='Dalam Proses').length,'Sedang dikembangkan')+stat('SELESAI',Object.values(rps).filter(x=>x.status==='Selesai').length,'Tuntas')+'</div><div class="toolbar"><input class="field search" placeholder="Cari mata kuliah" oninput="flt.q=this.value;refreshRps()"><select class="field" onchange="flt.status=this.value;refreshRps()"><option value="">Semua Status</option>'+['Belum Dimulai','Dalam Proses','Review','Selesai'].map(s=>'<option>'+s+'</option>').join('')+'</select></div><div class="panel" id="rl">'+rpsRows(list)+'</div>'}function rpsRows(list){return list.filter(c=>!flt.status||(rps[c.id]?.status||'Belum Dimulai')===flt.status).map(c=>{let x=rps[c.id]||{status:'Belum Dimulai',progress:0,link:''};return '<div class="rps"><b>'+esc(c.name)+'</b><p class="muted">'+esc(c.kbk)+' · Semester '+esc(c.semester)+' · Ketua KMK: '+esc(c.leader)+'</p><span class="tag">'+x.status+'</span><div class="progress"><span style="width:'+Number(x.progress)+'%"></span></div><small>Progress '+Number(x.progress)+'% '+(x.link?'<a target="_blank" href="'+esc(x.link)+'">Buka RPS</a>':'')+'</small> <button class="btn" onclick="rpsEdit(\''+c.id+'\')">Kelola RPS</button></div>'}).join('')}function refreshRps(){$('rl').innerHTML=rpsRows(filtered())}function rpsEdit(id){let x=rps[id]||{status:'Belum Dimulai',progress:0,link:'',notes:''},c=courses.find(c=>c.id===id);modal('Pengembangan RPS','<p><b>'+esc(c.name)+'</b><br>Ketua KMK: '+esc(c.leader)+'</p><form id="rf" class="form"><div class="fg"><label>Status</label><select name="status">'+['Belum Dimulai','Dalam Proses','Review','Selesai'].map(s=>'<option '+(x.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="fg"><label>Progress (%)</label><input type="number" min="0" max="100" name="progress" value="'+x.progress+'"></div><div class="fg full"><label>Link dokumen RPS</label><input type="url" name="link" value="'+esc(x.link)+'"></div><div class="fg full"><label>Catatan</label><textarea name="notes">'+esc(x.notes)+'</textarea></div></form>','<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveRps(\''+id+'\')">Simpan</button>')}function saveRps(id){let d=new FormData($('rf')),status=d.get('status'),progress=Math.max(0,Math.min(100,Number(d.get('progress'))||0));if(status==='Selesai')progress=100;rps[id]={status,progress,link:d.get('link'),notes:d.get('notes'),updated:new Date().toISOString()};save();closeModal();render()}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({courses,rps},null,2)],{type:'application/json'}));a.href=u;a.download='academic-curriculum-center-backup.json';a.click();URL.revokeObjectURL(u)}render();
</script></body></html>
